<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sooda — Buy & Sell in Pakistan</title>
<meta name="description" content="Sooda is Pakistan's friendly marketplace. Buy and sell mobiles, cars, property, electronics and more.">
<style>
/* Sooda — design system */
:root {
  --green-900: #0b3d2e;
  --green-700: #0e5c46;
  --green-600: #12805f;
  --green-100: #dcf0e7;
  --amber-500: #f2a007;
  --amber-600: #d98a00;
  --ink: #1c2420;
  --muted: #66756f;
  --line: #e3e9e5;
  --bg: #f4f6f4;
  --card: #ffffff;
  --danger: #c0392b;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(11, 61, 46, 0.08);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

/* ---------- header ---------- */
.site-header {
  background: var(--green-900);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}
.header-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  max-width: 1200px;
  margin: 0 auto;
}
.logo {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #fff;
  white-space: nowrap;
}
.logo span { color: var(--amber-500); }
.searchbar {
  flex: 1;
  display: flex;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  min-width: 0;
}
.searchbar select {
  border: none;
  background: var(--green-100);
  padding: 0 10px;
  font-size: 14px;
  max-width: 150px;
  color: var(--green-900);
  outline: none;
}
.searchbar input {
  flex: 1;
  border: none;
  padding: 11px 12px;
  font-size: 15px;
  outline: none;
  min-width: 0;
}
.searchbar button {
  border: none;
  background: var(--amber-500);
  color: #231a00;
  font-weight: 700;
  padding: 0 22px;
  cursor: pointer;
  font-size: 15px;
}
.searchbar button:hover { background: var(--amber-600); }
.nav-links { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.nav-links a { font-size: 14px; color: #dcebe3; }
.nav-links a:hover { color: #fff; }
.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #fff;
}
.user-chip .avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--amber-500);
  color: #231a00;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}
.sell-btn {
  background: var(--amber-500);
  color: #231a00 !important;
  font-weight: 800;
  padding: 9px 26px;
  border-radius: 8px;
  border-bottom: 3px solid var(--amber-600);
}
.sell-btn:hover { background: #ffbb33; }

/* ---------- hero ---------- */
.hero {
  background: linear-gradient(135deg, var(--green-900), var(--green-600));
  color: #fff;
  padding: 44px 0 36px;
  text-align: center;
}
.hero h1 { font-size: 34px; margin-bottom: 6px; letter-spacing: -0.5px; }
.hero p { color: #cfe6da; margin-bottom: 20px; }
.hero .stats {
  display: flex;
  justify-content: center;
  gap: 34px;
  margin-top: 22px;
  flex-wrap: wrap;
}
.hero .stats b { display: block; font-size: 22px; color: var(--amber-500); }
.hero .stats small { color: #bcd8c9; }

/* ---------- categories ---------- */
.section { padding: 30px 0 8px; }
.section h2 { font-size: 22px; margin-bottom: 14px; }
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
}
.cat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 8px;
  text-align: center;
  transition: transform 0.15s, box-shadow 0.15s;
}
.cat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: var(--green-600);
}
.cat-card svg { width: 34px; height: 34px; color: var(--green-700); }
.cat-card div { font-size: 13px; margin-top: 8px; font-weight: 600; }

/* ---------- ad cards ---------- */
.ads-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  padding-bottom: 30px;
}
.ad-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  transition: box-shadow 0.15s, transform 0.15s;
}
.ad-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.ad-card .thumb {
  aspect-ratio: 4 / 3;
  background: var(--green-100);
  overflow: hidden;
}
.ad-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.ad-card .body { padding: 12px 14px 14px; }
.ad-card .price { font-size: 19px; font-weight: 800; color: var(--green-900); }
.ad-card .price .neg {
  font-size: 11px;
  font-weight: 600;
  color: var(--amber-600);
  margin-left: 6px;
}
.ad-card .title {
  font-size: 14px;
  margin: 4px 0 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ad-card .meta { font-size: 12px; color: var(--muted); }
.fav-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.92);
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}
.fav-btn.active { color: #e11d48; }
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--green-100);
  color: var(--green-700);
  text-transform: uppercase;
}
.badge.sold { background: #fde2e2; color: var(--danger); }

/* ---------- browse layout ---------- */
.browse { display: flex; gap: 20px; align-items: flex-start; }
.filters {
  width: 240px;
  flex-shrink: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  position: sticky;
  top: 70px;
}
.filters h3 { font-size: 15px; margin-bottom: 12px; }
.filters label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 12px 0 4px;
  text-transform: uppercase;
}
.filters input, .filters select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
}
.price-row { display: flex; gap: 8px; }
.results { flex: 1; min-width: 0; }
.results-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.results-head select {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

/* ---------- ad detail ---------- */
.ad-detail {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
  padding: 24px 0 40px;
  align-items: start;
}
.gallery {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.gallery .main {
  aspect-ratio: 4 / 3;
  background: #0d1512;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gallery .main img { max-height: 100%; object-fit: contain; }
.gallery .thumbs { display: flex; gap: 8px; padding: 10px; }
.gallery .thumbs img {
  width: 74px;
  height: 56px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
}
.gallery .thumbs img.sel { border-color: var(--amber-500); }
.detail-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 16px;
}
.detail-box h3 { font-size: 17px; margin-bottom: 10px; }
.spec { display: flex; justify-content: space-between; padding: 7px 0;
  border-bottom: 1px solid var(--line); font-size: 14px; }
.spec:last-child { border-bottom: none; }
.spec span:first-child { color: var(--muted); }
.sidebar .price-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.sidebar .price { font-size: 30px; font-weight: 800; color: var(--green-900); }
.sidebar .ad-title { font-size: 16px; margin: 6px 0 4px; }
.sidebar .loc { font-size: 13px; color: var(--muted); }
.seller-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 14px;
  text-align: center;
}
.seller-card .avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--green-700);
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
}
.action-row { display: flex; gap: 10px; margin-top: 14px; }

/* ---------- buttons & forms ---------- */
.btn {
  display: inline-block;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  padding: 11px 22px;
  border-radius: 8px;
  background: var(--green-700);
  color: #fff;
  text-align: center;
}
.btn:hover { background: var(--green-600); }
.btn.amber { background: var(--amber-500); color: #231a00; }
.btn.amber:hover { background: var(--amber-600); }
.btn.ghost { background: #fff; color: var(--green-700);
  border: 1.5px solid var(--green-700); }
.btn.danger { background: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.form-card {
  max-width: 560px;
  margin: 34px auto 50px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow);
}
.form-card.wide { max-width: 760px; }
.form-card h2 { margin-bottom: 4px; }
.form-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--green-600);
}
.field textarea { min-height: 120px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check-row input { width: auto; }
.form-err {
  background: #fde2e2;
  color: var(--danger);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 16px;
  display: none;
}
.img-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.img-preview img {
  width: 90px;
  height: 68px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--line);
}

/* ---------- my ads table ---------- */
.myad {
  display: flex;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  align-items: center;
}
.myad img { width: 110px; height: 84px; object-fit: cover; border-radius: 8px; }
.myad .info { flex: 1; min-width: 0; }
.myad .info b { display: block; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.myad .info small { color: var(--muted); }
.myad .actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn.sm { padding: 7px 14px; font-size: 13px; }

/* ---------- footer ---------- */
.site-footer {
  background: var(--green-900);
  color: #bcd8c9;
  margin-top: 40px;
  padding: 34px 0 20px;
  font-size: 14px;
}
.footer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
}
.site-footer h4 { color: #fff; margin-bottom: 10px; font-size: 15px; }
.site-footer a { display: block; margin-bottom: 6px; }
.site-footer a:hover { color: #fff; }
.copyright {
  text-align: center;
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  font-size: 13px;
}

/* ---------- toast ---------- */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 12px 22px;
  border-radius: 30px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .ad-detail { grid-template-columns: 1fr; }
  .browse { flex-direction: column; }
  .filters { width: 100%; position: static; }
  .header-inner { flex-wrap: wrap; }
  .searchbar { order: 3; flex-basis: 100%; }
  .hero h1 { font-size: 26px; }
  .field-row { grid-template-columns: 1fr; }
}

</style>
</head>

/* ---------- helpers ---------- */
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmtPrice = (n) => 'Rs ' + Number(n).toLocaleString('en-PK');
function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(String(iso).replace(' ', 'T') + 'Z').getTime()) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' hours ago';
  const d = Math.floor(h / 24);
  if (d < 30) return d + (d === 1 ? ' day ago' : ' days ago');
  return Math.floor(d / 30) + ' months ago';
}
let toastTimer;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- local store (replaces the server) ---------- */
const LS = {
  read(k, d) { try { const v = localStorage.getItem('sooda_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  write(k, v) { try { localStorage.setItem('sooda_' + k, JSON.stringify(v)); } catch (e) { toast('Browser storage is full'); } },
};
const DEMO_USER = { name: 'Ahmed Raza', email: 'demo@sooda.pk', phone: '0300-1234567', pass: 'demo1234' };
if (!LS.read('users', null)) LS.write('users', [DEMO_USER]);

const currentUser = () => {
  const email = LS.read('session', null);
  return LS.read('users', []).find((u) => u.email === email) || null;
};
const allAds = () => {
  const mine = LS.read('myads', []);
  const deleted = LS.read('deleted', []);
  return DB.ads.filter((a) => !deleted.includes(String(a.id))).concat(mine);
};
const getAd = (id) => allAds().find((a) => String(a.id) === String(id));
const adSeller = (ad) => {
  if (ad.sellerEmail) {
    const u = LS.read('users', []).find((x) => x.email === ad.sellerEmail);
    if (u) return u;
  }
  return { name: ad.sellerName || 'Sooda Seller', phone: '0300-0000000' };
};
const adViews = (ad) => (ad.views || 0) + (LS.read('views', {})[String(ad.id)] || 0);
const isFav = (id) => {
  const u = currentUser();
  return u ? (LS.read('favs', {})[u.email] || []).includes(String(id)) : false;
};
function toggleFav(id) {
  const u = currentUser();
  if (!u) { location.hash = '#/login?next=' + encodeURIComponent(location.hash); return false; }
  const favs = LS.read('favs', {});
  const list = favs[u.email] || [];
  const sid = String(id);
  favs[u.email] = list.includes(sid) ? list.filter((x) => x !== sid) : list.concat([sid]);
  LS.write('favs', favs);
  return favs[u.email].includes(sid);
}

function bindCommon() {
  const sf = document.getElementById('search-form');
  if (sf) sf.addEventListener('submit', (e) => {
    e.preventDefault();
    filters.q = document.getElementById('search-q').value.trim();
    filters.location = document.getElementById('search-loc').value;

// Favorite buttons: delegated once on #app (which persists across renders).
function bindFavDelegation() {
  document.getElementById('app').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-fav]');
    if (!btn) return;
    e.preventDefault();
    const added = toggleFav(btn.dataset.fav);
    if (added === false && !currentUser()) return;
    btn.classList.toggle('active', added);
    btn.textContent = added ? '♥' : '♡';
    if (added) toast('Saved to favorites');
    if (btn.dataset.favPage === '1' && !added) setTimeout(navigate, 350);
  });
}

/* ---------- router ---------- */
let filters = { q: '', category: '', location: '', condition: 'any', min: '', max: '', sort: 'newest' };
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const qi = h.indexOf('?');
  return { path: qi === -1 ? h : h.slice(0, qi), params: new URLSearchParams(qi === -1 ? '' : h.slice(qi + 1)) };
}
const routes = {};
function navigate() {
  const { path, params } = parseHash();
  const view = routes[path] || routes[''];
  window.scrollTo(0, 0);
  document.getElementById('app').innerHTML = headerHtml() + view.html(params) + footerHtml();
  bindCommon();
  if (view.bind) view.bind(params);
}
window.addEventListener('hashchange', navigate);

function adCard(a) {
  const fav = isFav(a.id);
  const thumb = a.images[0] ? `<img src="${IMG[a.images[0]] || a.images[0]}" alt="" loading="lazy">` : '';

    <div class="body"><div class="price">${fmtPrice(a.price)}${a.negotiable ? '<span class="neg">Negotiable</span>' : ''}</div>
    <div class="title">${esc(a.title)}</div>
    <div class="meta">${esc(a.location)} · ${timeAgo(a.created_at)}</div></div></a></div>`;
}

routes['post'] = {

      <div class="field"><label>Location *</label><select id="f-loc">

      <div class="field"><label>Description *</label><textarea id="f-desc" required placeholder="Describe your item...">${esc(existing ? existing.description : '')}</textarea></div>
      <div class="field-row"><div class="field"><label>Price (Rs) *</label><input id="f-price" type="number" min="0" required value="${existing ? existing.price : ''}" placeholder="e.g. 85000"></div>
      <div class="field"><label>Condition</label><select id="f-cond">
      <option value="used"${existing && existing.condition === 'used' ? ' selected' : ''}>Used</option>
      <option value="new"${existing && existing.condition === 'new' ? ' selected' : ''}>New</option></select></div></div>
      <div class="field"><label class="check-row"><input type="checkbox" id="f-neg" style="width:auto"${existing && existing.negotiable ? ' checked' : ''}> Price is negotiable</label></div>
      ${existing ? '' : `<div class="field"><label>Photos (up to 6)</label><input id="f-imgs" type="file" accept="image/*" multiple><div class="hint">Stored in your browser.</div><div class="img-preview" id="img-prev"></div></div>`}
      <button class="btn amber block" type="submit">${existing ? 'Save changes' : 'Post ad now'}</button>
    </form></div></main>`;
  },
  bind(params) {
    const u = currentUser();
    if (!u) return;
    const editId = params.get('edit');
    const prev = document.getElementById('img-prev');
    const fi = document.getElementById('f-imgs');
    if (fi) fi.addEventListener('change', () => {
      prev.innerHTML = '';
      [...fi.files].slice(0, 6).forEach((f) => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        prev.appendChild(img);
      });
    });
    document.getElementById('ad-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const cat = DB.categories.find((c) => c.slug === document.getElementById('f-cat').value);
      const base = {
        title: document.getElementById('f-title').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        price: Math.max(0, Math.round(Number(document.getElementById('f-price').value) || 0)),
        condition: document.getElementById('f-cond').value,
        negotiable: document.getElementById('f-neg').checked ? 1 : 0,
        location: document.getElementById('f-loc').value,
        category: { id: cat.id, name: cat.name, slug: cat.slug },
      };
      if (!base.title || !base.description || !base.price) { toast('Please fill all required fields'); return; }
      const done = (images) => {
        const myads = LS.read('myads', []);
        if (editId) {
          const ad = myads.find((a) => String(a.id) === String(editId));
          Object.assign(ad, base);
          LS.write('myads', myads);
          toast('Ad updated');
          location.hash = '#/ad?id=' + ad.id;
        } else {
          const ad = Object.assign({ id: 'u' + Date.now(), sellerEmail: u.email, created_at: new Date().toISOString().slice(0, 19).replace('T', ' '), views: 0, status: 'active', images }, base);
          myads.unshift(ad);
          LS.write('myads', myads);
          toast('Your ad is live!');
          location.hash = '#/ad?id=' + ad.id;
        }
      };
      if (editId || !fi || !fi.files.length) { done(editId ? undefined : []); return; }
      const files = [...fi.files].slice(0, 6);
      const out = [];
      let n = 0;
      files.forEach((f) => {
        const r = new FileReader();
        r.onload = () => { out.push(r.result); if (++n === files.length) done(out); };
        r.readAsDataURL(f);
      });
    });
  },
};

  html() {
    return `<main class="wrap"><div class="form-card"><h2>Create your account</h2>
    <p class="sub">Free forever. Saved in this browser.</p>
    <div class="form-err" id="form-err"></div>
    <form id="auth-form"><div class="field"><label>Full name</label><input id="a-name" required></div>
    <div class="field"><label>Email</label><input id="a-email" type="email" required></div>
    <div class="field"><label>Phone / WhatsApp</label><input id="a-phone" required></div>
    <div class="field"><label>Password</label><input id="a-pass" type="password" required minlength="6"></div>
    <button class="btn block" type="submit">Create account</button></form>
    <p style="margin-top:16px;font-size:14px;text-align:center">Already have an account? <a href="#/login" style="color:#0e5c46;font-weight:700">Log in</a></p></div></main>`;
  },
  bind() {
    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('a-email').value.trim().toLowerCase();
      const users = LS.read('users', []);
      if (users.find((x) => x.email === email)) { const er = document.getElementById('form-err'); er.textContent = 'Email already registered.'; er.style.display = 'block'; return; }
      users.push({ name: document.getElementById('a-name').value.trim(), email, phone: document.getElementById('a-phone').value.trim(), pass: document.getElementById('a-pass').value });
      LS.write('users', users);
      LS.write('session', email);
      toast('Account created — welcome!');
      setTimeout(() => { location.hash = '#/'; }, 600);
    });
  },
};

/* ---------- my ads ---------- */
routes['my-ads'] = {
  html() {
    const u = currentUser();
    if (!u) { setTimeout(() => { location.hash = '#/login?next=' + encodeURIComponent('#/my-ads'); }, 0); return '<main class="wrap"><div class="empty" style="margin:30px 0">Please log in...</div></main>'; }
    const mine = allAds().filter((a) => a.sellerEmail === u.email || (u.email === DEMO_USER.email && !a.sellerEmail));
    const rows = mine.map((a) => {
      const thumb = a.images[0] ? `<img src="${IMG[a.images[0]] || a.images[0]}" alt="">` : '';
      return `<div class="myad"><a href="#/ad?id=${a.id}">${thumb}</a>
      <div class="info"><b>${esc(a.title)}</b><small>${fmtPrice(a.price)} · ${esc(a.location)} · ${adViews(a)} views</small>
      <div style="margin-top:6px"><span class="badge ${(a.status || 'active') !== 'active' ? 'sold' : ''}">${esc(a.status || 'active')}</span></div></div>
      <div class="actions">${a.sellerEmail ? `<a class="btn sm ghost" href="#/post?edit=${a.id}">Edit</a>` : ''}
      <button class="btn sm ghost" data-sold="${a.id}">${(a.status || 'active') === 'active' ? 'Mark sold' : 'Reactivate'}</button>
      <button class="btn sm danger" data-del="${a.id}">Delete</button></div></div>`;
    }).join('');
    return `<main class="wrap"><section class="section"><div class="results-head"><h2>My ads</h2>
    <a class="btn amber" href="#/post">+ Post new ad</a></div>
    ${mine.length ? rows : `<div class="empty"><h3>No ads yet</h3><a class="btn amber" href="#/post" style="margin-top:12px">Post a free ad</a></div>`}
    </section></main>`;
  },
  bind() {
    document.getElementById('app').addEventListener('click', function h(e) {
      const del = e.target.closest('[data-del]');
      const sold = e.target.closest('[data-sold]');
      if (del) {
        if (!confirm('Delete this ad permanently?')) return;
        const id = String(del.dataset.del);
        if (/^u/.test(id)) LS.write('myads', LS.read('myads', []).filter((a) => String(a.id) !== id));
        else LS.write('deleted', LS.read('deleted', []).concat([id]));
        toast('Ad deleted'); navigate();
      } else if (sold) {
        const id = String(sold.dataset.sold);
        const ad = getAd(id);
        const to = (ad.status || 'active') === 'active' ? 'sold' : 'active';
        if (/^u/.test(id)) { const m = LS.read('myads', []); m.find((a) => String(a.id) === id).status = to; LS.write('myads', m); }
        else { const st = LS.read('status', {}); st[id] = to; LS.write('status', st); }
        toast(to === 'sold' ? 'Marked as sold' : 'Ad reactivated');
        setTimeout(navigate, 500);
      }
    }, { once: true });
  },
};

/* ---------- favorites ---------- */
routes['favorites'] = {
  html() {
    const u = currentUser();
    if (!u) { setTimeout(() => { location.hash = '#/login?next=' + encodeURIComponent('#/favorites'); }, 0); return '<main class="wrap"><div class="empty" style="margin:30px 0">Please log in...</div></main>'; }
    const list = (LS.read('favs', {})[u.email] || []).map(getAd).filter(Boolean);
    return `<main class="wrap"><section class="section"><h2>My favorites</h2>

      : `<div class="empty"><h3>No favorites yet</h3><p>Tap ♡ on any ad to save it here.</p><a class="btn" href="#/" style="margin-top:12px">Browse ads</a></div>`}
    </section></main>`;
  },
};
